<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💌</title>
  <meta name="description" content="💌" />
  <style>
    :root{
      --bg1:#7a0010;
      --bg2:#ff2a5f;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --yes1:#22c55e;
      --yes2:#15803d;
      --no1:#fb7185;
      --no2:#e11d48;
      --shadow: 0 18px 60px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      overflow:hidden;
      background:
        radial-gradient(1200px 700px at 70% 20%, rgba(255,255,255,.18), transparent 60%),
        radial-gradient(900px 600px at 20% 80%, rgba(255,255,255,.12), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    /* duże serce w tle */
    .heart-bg{
      position:absolute;
      width:min(80vmin, 560px);
      height:min(80vmin, 560px);
      opacity:.18;
      filter: drop-shadow(0 18px 50px rgba(0,0,0,.25));
      transform: rotate(-8deg);
      pointer-events:none;
    }
    .heart-bg::before,
    .heart-bg::after{
      content:"";
      position:absolute;
      width:60%;
      height:60%;
      background: rgba(255,255,255,.95);
      border-radius: 50%;
      top:10%;
    }
    .heart-bg::before{ left:10%; }
    .heart-bg::after{ right:10%; }
    .heart-bg .bottom{
      position:absolute;
      width:68%;
      height:68%;
      background: rgba(255,255,255,.95);
      left:16%;
      top:22%;
      transform: rotate(45deg);
      border-radius: 18px;
    }

    .wrap{ position:relative; width:min(92vw, 760px); padding:28px; }
    .card{
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 26px;
      padding: 28px;
      box-shadow: var(--shadow);
    }
    h1{
      margin:0 0 10px;
      font-size: clamp(26px, 3.4vw, 40px);
      letter-spacing:-.02em;
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }
    p{
      margin:0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height:1.5;
    }
    .name{
      display:inline-block;
      padding: 2px 12px;
      border-radius: 999px;
      background: rgba(255,42,95,.12);
      color:#b3002a;
      font-weight:700;
    }

    .arena{
      position:relative;
      height: 170px;
      margin-top: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.65);
      border: 1px dashed rgba(17,24,39,.18);
      overflow:hidden;
    }

    .btn{
      border:0;
      border-radius: 999px;
      padding: 14px 18px;
      font-weight: 800;
      font-size: 16px;
      cursor:pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
      transition: transform .12s ease, filter .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      position:absolute;
      top: 55%;
      transform: translateY(-50%);
    }
    .btn:active{ transform: translateY(-50%) scale(.98); }
    .btn:hover{ filter: brightness(1.05); }

    .btn-yes{
      background: linear-gradient(180deg, var(--yes1), var(--yes2));
      color:white;
      left: 12%;
    }
    .btn-no{
      background: linear-gradient(180deg, var(--no1), var(--no2));
      color:white;
      left: 62%;
    }

    /* Modal */
    .modal{
      position:fixed; inset:0;
      display:none; place-items:center;
      background: rgba(0,0,0,.45);
      padding: 18px;
    }
    .modal.open{ display:grid; }
    .modal .box{
      width:min(92vw, 560px);
      background:white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .modal h2{
      margin: 6px 0 10px;
      font-size: 28px;
      letter-spacing:-.02em;
    }
    .modal p{ margin:0 0 14px; }
    .row{
      display:flex; gap:12px;
      justify-content:center; flex-wrap:wrap;
      margin-top: 10px;
    }
    .btn-close{
      background:#111827;
      color:white;
      position:static;
      transform:none;
    }

    /* Confetti layer */
    .confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    .confetti .piece{
      position:absolute;
      top:-10vh;
      width: 10px;
      height: 14px;
      border-radius: 3px;
      opacity: .95;
      transform: translateY(-20px) rotate(0deg);
      animation: fall linear forwards;
    }
    @keyframes fall{
      to{
        transform: translateY(120vh) rotate(720deg);
        opacity: 1;
      }
    }

    /* Pop animation for the card */
    .pop{
      animation: pop .45s ease-out both;
    }
    @keyframes pop{
      0%{ transform: scale(.96); opacity:.0; }
      100%{ transform: scale(1); opacity:1; }
    }
  </style>
</head>
<body>
  <div class="heart-bg" aria-hidden="true"><div class="bottom"></div></div>

  <main class="wrap">
    <section class="card">
      <h1>
        Hej <span class="name">Vica</span> 💘
      </h1>
      <p>
        Mam jedno ważne pytanie…
        <br/>
        <strong>Czy zostaniesz moją Walentynką?</strong>
      </p>

      <div class="arena" id="arena" aria-label="Pole wyboru">
        <button class="btn btn-yes" id="yes">TAK 💚</button>
        <button class="btn btn-no" id="no">NIE ❤️‍🔥</button>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="box pop">
      <h2 id="mTitle">YEEES! 🥰💞</h2>
      <p>To oficjalne — jesteś moją Walentynką! ✨</p>
      <div class="row">
        <button class="btn btn-close" id="close">Zamknij</button>
      </div>
    </div>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script>
    const arena = document.getElementById("arena");
    const btnNo = document.getElementById("no");
    const btnYes = document.getElementById("yes");
    const modal = document.getElementById("modal");
    const close = document.getElementById("close");
    const confetti = document.getElementById("confetti");

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function moveNoAway(pointerX, pointerY){
      const a = arena.getBoundingClientRect();
      const b = btnNo.getBoundingClientRect();

      const maxX = a.width - b.width - 12;
      const maxY = a.height - b.height - 12;

      const cx = (pointerX - a.left);
      const cy = (pointerY - a.top);

      const awayX = cx < a.width/2 ? 1 : -1;
      const awayY = cy < a.height/2 ? 1 : -1;

      const jitterX = (Math.random() * 0.35 + 0.15) * maxX;
      const jitterY = (Math.random() * 0.35 + 0.15) * maxY;

      let x = (awayX > 0) ? (maxX - jitterX) : (jitterX);
      let y = (awayY > 0) ? (maxY - jitterY) : (jitterY);

      x = clamp(x, 8, maxX);
      y = clamp(y, 8, maxY);

      btnNo.style.left = x + "px";
      btnNo.style.top  = y + "px";
      btnNo.style.transform = "none";
    }

    btnNo.addEventListener("mouseenter", (e) => moveNoAway(e.clientX, e.clientY));
    btnNo.addEventListener("mousemove", (e) => moveNoAway(e.clientX, e.clientY));
    btnNo.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      moveNoAway(t.clientX, t.clientY);
    }, {passive:true});
    btnNo.addEventListener("click", (e) => moveNoAway(e.clientX, e.clientY));

    function clearConfetti(){
      confetti.innerHTML = "";
    }

    function launchConfetti(){
      clearConfetti();
      const pieces = 160;
      const colors = [
        "#ffffff","#ffe4e6","#fecdd3","#fda4af","#fb7185",
        "#34d399","#22c55e","#a7f3d0","#f59e0b","#fde68a"
      ];

      for(let i=0;i<pieces;i++){
        const p = document.createElement("div");
        p.className = "piece";
        p.style.left = (Math.random()*100) + "vw";
        p.style.width = (6 + Math.random()*10) + "px";
        p.style.height = (8 + Math.random()*14) + "px";
        p.style.background = colors[(Math.random()*colors.length)|0];
        p.style.animationDuration = (2.4 + Math.random()*1.8) + "s";
        p.style.animationDelay = (Math.random()*0.15) + "s";
        confetti.appendChild(p);
      }

      // sprzątanie po animacji
      setTimeout(clearConfetti, 4500);
    }

    btnYes.addEventListener("click", () => {
      launchConfetti();
      modal.classList.add("open");
    });

    close.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if(e.target === modal) modal.classList.remove("open");
    });
  </script>
</body>
</html>
